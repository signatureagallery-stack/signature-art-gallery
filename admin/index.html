<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Back-office — Signature Art Gallery</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,400&family=Inter:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap');
  :root{--ink:#ffffff; --paper:#0b0b0c; --signature:#e2087a;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--ink); color:var(--paper); font-family:'Inter',sans-serif; font-weight:300; padding:40px 6vw 100px;}
  h1{font-family:'Fraunces',serif; font-weight:500; font-size:32px; margin-bottom:8px; text-align:center;}
  .subtitle{font-family:'IBM Plex Mono',monospace; font-size:11px; opacity:0.5; letter-spacing:0.5px; margin-bottom:40px; text-align:center;}

  #login-view{max-width:360px; margin:80px auto;}
  #login-view h1{text-align:center;}
  .field{margin-bottom:16px;}
  .field label{display:block; font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.5px; opacity:0.6; margin-bottom:6px;}
  .field input{width:100%; padding:12px 14px; border:1px solid rgba(11,11,12,0.2); font-family:'Inter',sans-serif; font-size:14px; background:#fff; color:var(--paper);}
  button{font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:1px; text-transform:uppercase; background:var(--signature); color:#fff; border:none; padding:14px 24px; cursor:pointer;}
  .error-msg{color:#b3261e; font-size:13px; margin-top:10px;}

  #app-view{display:none;}
  #logout-link{position:fixed; top:24px; right:6vw; font-family:'IBM Plex Mono',monospace; font-size:11px; opacity:0.6; cursor:pointer;}

  .menu-grid{
    max-width:420px; margin:60px auto 0; display:flex; flex-direction:column; gap:16px;
  }
  .menu-card{
    display:flex; align-items:center; gap:16px; padding:22px 24px;
    border:1px solid rgba(11,11,12,0.15); text-decoration:none; color:var(--paper);
    transition:border-color 0.15s ease, background 0.15s ease;
  }
  .menu-card:hover{ border-color:var(--signature); background:rgba(226,8,122,0.03); }
  .menu-card .icon{font-size:26px; line-height:1; flex-shrink:0;}
  .menu-card .label{font-family:'Fraunces',serif; font-size:19px; font-weight:500;}

  @media (max-width:480px){
    .menu-card{padding:18px 18px;}
    .menu-card .label{font-size:17px;}
  }
</style>
</head>
<body>

<div id="login-view">
  <h1>Back-office</h1>
  <div class="field">
    <label>Mot de passe</label>
    <input type="password" id="password-input" autofocus>
  </div>
  <button id="login-btn" style="width:100%;">Se connecter</button>
  <div id="login-error" class="error-msg"></div>
</div>

<div id="app-view">
  <span id="logout-link" onclick="logout()">Se déconnecter</span>
  <h1>Back-office</h1>
  <div class="subtitle">Signature Art Gallery</div>

  <div class="menu-grid">
    <a class="menu-card" href="/admin/boutique.html">
      <span class="icon">🛍️</span><span class="label">Boutique</span>
    </a>
    <a class="menu-card" href="/admin/exhibitions.html">
      <span class="icon">🎨</span><span class="label">Expositions</span>
    </a>
    <a class="menu-card" href="/admin/artworks.html">
      <span class="icon">🖼️</span><span class="label">Œuvres</span>
    </a>
    <a class="menu-card" href="/admin/placement.html">
      <span class="icon">📐</span><span class="label">Placement des œuvres</span>
    </a>
  </div>
</div>

<script>
  // Même mécanisme de vérification de session que sur toutes les autres
  // pages du back-office (réutilise /api/products, déjà protégé par
  // isValidSession côté serveur). Aucun nouveau système d'authentification.
  async function checkSession() {
    const r = await fetch('/api/products');
    if (r.status === 200) showApp();
  }

  function showApp() {
    document.getElementById('login-view').style.display = 'none';
    document.getElementById('app-view').style.display = 'block';
  }

  document.getElementById('login-btn').addEventListener('click', async () => {
    const password = document.getElementById('password-input').value;
    const errEl = document.getElementById('login-error');
    errEl.textContent = '';
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password }),
    });
    if (r.ok) {
      showApp();
    } else {
      errEl.textContent = 'Mot de passe incorrect.';
    }
  });

  document.getElementById('password-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('login-btn').click();
  });

  // Même logique de déconnexion que sur les autres pages (suppression du
  // cookie de session existant, aucune nouvelle logique créée).
  function logout() {
    document.cookie = 'sag_session=; Max-Age=0; Path=/;';
    location.reload();
  }

  checkSession();
</script>

</body>
</html>
