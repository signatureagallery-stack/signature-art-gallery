<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Back-office — Signature Art Gallery</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,400&family=Inter:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap');
  :root{--ink:#ffffff; --paper:#0b0b0c; --signature:#e2087a;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--ink); color:var(--paper); font-family:'Inter',sans-serif; font-weight:300; padding:40px 6vw 100px;}
  h1{font-family:'Fraunces',serif; font-weight:500; font-size:32px; margin-bottom:8px;}
  .subtitle{font-family:'IBM Plex Mono',monospace; font-size:11px; opacity:0.5; letter-spacing:0.5px; margin-bottom:40px;}

  #login-view{max-width:360px; margin:80px auto;}
  #login-view h1{text-align:center;}
  .field{margin-bottom:16px;}
  .field label{display:block; font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.5px; opacity:0.6; margin-bottom:6px;}
  .field input, .field textarea, .field select{
    width:100%; padding:12px 14px; border:1px solid rgba(11,11,12,0.2); font-family:'Inter',sans-serif; font-size:14px; background:#fff; color:var(--paper);
  }
  .field textarea{resize:vertical;}
  button{
    font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:1px; text-transform:uppercase;
    background:var(--signature); color:#fff; border:none; padding:14px 24px; cursor:pointer;
  }
  button:disabled{opacity:0.5; cursor:default;}
  button.secondary{background:none; color:var(--paper); border:1px solid var(--paper);}
  .error-msg{color:#b3261e; font-size:13px; margin-top:10px;}
  .success-msg{color:#1a7a3c; font-size:13px; margin-top:10px;}

  #app-view{display:none; max-width:1000px; margin:0 auto;}
  .grid-2{display:grid; grid-template-columns:1fr 1fr; gap:20px;}
  .form-box{border:1px solid rgba(11,11,12,0.15); padding:32px; margin-bottom:60px;}
  .form-box h2{font-family:'Fraunces',serif; font-size:22px; margin-bottom:24px;}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{text-align:left; font-family:'IBM Plex Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:0.5px; opacity:0.5; padding:10px 8px; border-bottom:1px solid rgba(11,11,12,0.15);}
  td{padding:10px 8px; border-bottom:1px solid rgba(11,11,12,0.08); vertical-align:middle;}
  td img{width:44px; height:55px; object-fit:cover; background:#f4f4f4;}
  .del-btn{background:none; border:1px solid #b3261e; color:#b3261e; padding:6px 12px; font-size:10px;}
  .status-tag{font-family:'IBM Plex Mono',monospace; font-size:10px; padding:2px 8px; border-radius:2px;}
  .status-tag.disponible{background:#e6f4ea; color:#1a7a3c;}
  .status-tag.vendu{background:#f9e6e6; color:#b3261e;}

  #logout-link{position:fixed; top:24px; right:6vw; font-family:'IBM Plex Mono',monospace; font-size:11px; opacity:0.6; cursor:pointer;}
</style>
</head>
<body>

<div id="login-view">
  <h1>Back-office</h1>
  <div class="field">
    <label>Mot de passe</label>
    <input type="password" id="password-input" autofocus>
  </div>
  <button id="login-btn" style="width:100%;">Se connecter</button>
  <div id="login-error" class="error-msg"></div>
</div>

<div id="app-view">
  <span id="logout-link" onclick="logout()">Se déconnecter</span>
  <h1>Signature Art Gallery</h1>
  <div class="subtitle">Back-office — gestion des œuvres</div>

  <div class="form-box">
    <h2>Ajouter une œuvre</h2>
    <form id="add-form">
      <div class="grid-2">
        <div class="field"><label>Artiste *</label><input type="text" name="artist" required></div>
        <div class="field"><label>Prix (TL) *</label><input type="text" name="price" required placeholder="ex: 25.000"></div>
        <div class="field"><label>Titre (Français) *</label><input type="text" name="title_fr" required></div>
        <div class="field"><label>Titre (Turc)</label><input type="text" name="title_tr" placeholder="si vide = même que FR"></div>
        <div class="field"><label>Dimensions</label><input type="text" name="dimensions" placeholder="ex: 60x60 cm"></div>
        <div class="field"><label>Technique</label><input type="text" name="technique" placeholder="ex: Huile sur toile"></div>
        <div class="field"><label>Année</label><input type="text" name="year"></div>
        <div class="field">
          <label>Statut</label>
          <select name="status"><option value="disponible">Disponible</option><option value="vendu">Vendu</option></select>
        </div>
      </div>
      <div class="field"><label>Description (Français)</label><textarea name="desc_fr" rows="3"></textarea></div>
      <div class="field"><label>Description (Turc)</label><textarea name="desc_tr" rows="3"></textarea></div>
      <div class="field"><label>Photo de l'œuvre *</label><input type="file" name="image" accept="image/*" required></div>
      <button type="submit" id="submit-btn">Publier l'œuvre</button>
      <div id="add-error" class="error-msg"></div>
      <div id="add-success" class="success-msg"></div>
    </form>
  </div>

  <h2 style="font-family:'Fraunces',serif; font-size:22px; margin-bottom:20px;">Œuvres publiées (<span id="count">…</span>)</h2>
  <table>
    <thead><tr><th></th><th>Artiste</th><th>Titre</th><th>Prix</th><th>Statut</th><th></th></tr></thead>
    <tbody id="products-list"><tr><td colspan="6" style="padding:20px 8px; opacity:0.5;">Chargement…</td></tr></tbody>
  </table>
</div>

<script>
  async function checkSession() {
    const r = await fetch('/api/products');
    if (r.status === 200) {
      showApp();
      loadProducts();
    }
  }

  function showApp() {
    document.getElementById('login-view').style.display = 'none';
    document.getElementById('app-view').style.display = 'block';
  }

  document.getElementById('login-btn').addEventListener('click', async () => {
    const password = document.getElementById('password-input').value;
    const errEl = document.getElementById('login-error');
    errEl.textContent = '';
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password }),
    });
    if (r.ok) {
      showApp();
      loadProducts();
    } else {
      errEl.textContent = 'Mot de passe incorrect.';
    }
  });

  document.getElementById('password-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('login-btn').click();
  });

  function logout() {
    document.cookie = 'sag_session=; Max-Age=0; Path=/;';
    location.reload();
  }

  async function loadProducts() {
    const r = await fetch('/api/products');
    const data = await r.json();
    const products = data.products || [];
    document.getElementById('count').textContent = products.length;
    const tbody = document.getElementById('products-list');
    if (products.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" style="padding:20px 8px; opacity:0.5;">Aucune œuvre pour le moment.</td></tr>';
      return;
    }
    tbody.innerHTML = products.map(p => `
      <tr>
        <td><img src="/assets/images/boutique/${p.image}" alt=""></td>
        <td>${p.artist}</td>
        <td>${p.title}</td>
        <td>${p.price} TL</td>
        <td><span class="status-tag ${p.status}">${p.status === 'vendu' ? 'Vendu' : 'Disponible'}</span></td>
        <td><button class="del-btn" onclick="deleteProduct('${p.slug}','${p.image}')">Supprimer</button></td>
      </tr>
    `).join('');
  }

  async function deleteProduct(slug, image) {
    if (!confirm('Supprimer définitivement cette œuvre ?')) return;
    const r = await fetch('/api/products', {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ slug, image }),
    });
    if (r.ok) {
      loadProducts();
    } else {
      alert('Erreur lors de la suppression.');
    }
  }

  document.getElementById('add-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    const errEl = document.getElementById('add-error');
    const okEl = document.getElementById('add-success');
    errEl.textContent = '';
    okEl.textContent = '';
    btn.disabled = true;
    btn.textContent = 'Publication en cours…';

    const formData = new FormData(e.target);
    try {
      const r = await fetch('/api/add-artwork', { method: 'POST', body: formData });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || 'Erreur inconnue');
      okEl.textContent = "Œuvre publiée ! Le site se met à jour automatiquement (1-2 minutes).";
      e.target.reset();
      loadProducts();
    } catch (err) {
      errEl.textContent = err.message;
    } finally {
      btn.disabled = false;
      btn.textContent = "Publier l'œuvre";
    }
  });

  checkSession();
</script>

</body>
</html>
